name: CI

on:
    pull_request:
        branches: [my-new-branch]
    push:
        branches: [my-new-branch]

jobs:
    build-and-test:
        name: Build the project
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run eslint
              run: npm run lint:ci

            - name: Test and coverage
              env:
                  NODE_ENV: test

                  # --- Supabase DB (set these in repo Secrets) ---
                  # Either provide DATABASE_URL, or the individual DB_* values.
                  DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
                  DB_SSL: "true"

                 

                  # JWT stuff
                  REFRESH_TOKEN_SECRET: ${{ secrets.REFRESH_TOKEN_SECRET }}
                  PRIVATE_KEY_BASE64: ${{ secrets.PRIVATE_KEY_BASE64 }}
                  JWKS_URI: http://localhost:5501/.well-known/jwks.json

                  # Networking: prefer IPv4 on Node 18 to avoid ENETUNREACH (::)
                  NODE_OPTIONS: --dns-result-order=ipv4first
                  PGSSLMODE: require
              run: npm run test

            - name: Build
              run: npm run build

            - name: SonarCloud Scan
              if: ${{ env.SONAR_TOKEN != '' }}
              uses: SonarSource/sonarcloud-github-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    build-and-push-docker:
        name: Build and Push Docker Image
        needs: build-and-test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/my-new-branch' && github.event_name == 'push'
        env:
            IMAGE_NAME: muhammadhammadshah2000/mernstack_auth_service
            IMAGE_TAG: build-${{ github.run_number }}
        steps:
            - uses: actions/checkout@v4
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_PASSWORD }}
            - name: Build Docker image
              run: docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -f docker/prod/Dockerfile .
            - name: Push Docker image to Docker Hub
              run: docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
